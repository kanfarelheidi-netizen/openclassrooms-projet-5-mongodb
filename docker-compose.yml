name: p05-medical

services:
  mongo:
    image: mongo:8.0.30-noble
    environment:
      MONGO_INITDB_ROOT_USERNAME: p05_admin
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongo_root_password
      MONGO_INITDB_DATABASE: p05_medical
    secrets:
      - mongo_root_password
      - mongo_ingest_password
      - mongo_reader_password
    volumes:
      - mongo_data:/data/db
      - ./mongo-init/01-users.js:/docker-entrypoint-initdb.d/01-users.js:ro
    ports:
      - "127.0.0.1:27017:27017"
    networks:
      - p05_internal
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok ? quit(0) : quit(1)'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  migrator:
    build: .
    command: ["python", "P05_Migration.py", "--mode", "migrate", "--csv", "/data/healthcare_dataset.csv", "--report", "/reports/P05_Controle_migration_reelle.json"]
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      P05_MONGO_HOST: mongo
      P05_MONGO_PORT: "27017"
      P05_MONGO_DB: p05_medical
      P05_MONGO_USER: p05_ingest
      P05_MONGO_PASSWORD_FILE: /run/secrets/mongo_ingest_password
    secrets:
      - mongo_ingest_password
    volumes:
      - ./out:/reports
      - type: bind
        source: ${P05_DATASET_PATH:-./data/healthcare_dataset.csv}
        target: /data/healthcare_dataset.csv
        read_only: true
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - p05_internal

volumes:
  mongo_data:

networks:
  p05_internal:
    name: p05_internal

secrets:
  mongo_root_password:
    file: ./secrets/mongo_root_password.txt
  mongo_ingest_password:
    file: ./secrets/mongo_ingest_password.txt
  mongo_reader_password:
    file: ./secrets/mongo_reader_password.txt
